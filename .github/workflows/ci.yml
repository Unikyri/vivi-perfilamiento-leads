name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Empaquetar frontend antes de compilar Go
        run: npm run heroku-postbuild
      - name: Verificar entrypoint y assets hasheados
        run: |
          test -s internal/adapters/http/estaticos/index.html
          test -n "$(find internal/adapters/http/estaticos/assets -type f -print -quit 2>/dev/null)" || {
            echo "::error::faltan assets hasheados de Vite"
            exit 1
          }
      - name: Configurar Go desde go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Descargar dependencias
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1 -race
      - name: Verificar regla de dependencia (Clean Architecture)
        run: |
          echo "domain no puede importar usecase/adapters/infrastructure"
          if go list -deps ./internal/domain/... | grep -E "vivi-perfilamiento-leads/internal/(usecase|adapters|infrastructure)"; then
            echo "::error::internal/domain importa capas externas — viola NFR-M-01"
            exit 1
          fi
          echo "usecase no puede importar adapters/infrastructure"
          if go list -deps ./internal/usecase/... | grep -E "vivi-perfilamiento-leads/internal/(adapters|infrastructure)"; then
            echo "::error::internal/usecase importa adapters o infrastructure — viola NFR-M-01"
            exit 1
          fi
      - name: Build
        run: go build -o bin/servidor ./cmd/servidor

  frontend:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Existe el frontend?
        id: existe
        run: |
          if [ -f web/package.json ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configurar Node
        if: steps.existe.outputs.hay == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar y compilar
        if: steps.existe.outputs.hay == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verificar que los estáticos versionados están al día
        if: steps.existe.outputs.hay == 'true'
        run: |
          if ! git diff --quiet -- internal/adapters/http/estaticos; then
            echo "::error::internal/adapters/http/estaticos está desactualizado respecto de web/src."
            echo "Ejecutá 'make front-build' y commiteá el resultado."
            git diff --stat -- internal/adapters/http/estaticos
            exit 1
          fi
          echo "Estáticos al día."

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
