decisions:
  files: Create exactly procesar_mensaje.go, siguiente_pregunta.go, procesar_mensaje_test.go; no ADK, HTTP, port, DTO, or Contract edits.
  interface: EntradaMensaje, ProcesarMensaje, sentinels, and question helpers are declared only in the new usecase files; preserve existing port signatures.
  helpers: Use exact issue priority ingreso_hogar, recursos_propios, zona_deseada, plazo_compra_meses, arriendo_actual, personas_hogar; completion requires the first three.
  motor: Use motor.CalcularCapacidad(updatedPerfil, lead.Afiliado, 0); no ParametrosCredito, no domain.Campo* symbols.
  profile_integrity: Validate all recognized output before mutation; preserve verified fields, downgrade provider VERIFICADO_BASE to DECLARADO, ignore unknown keys, reject duplicate recognized keys, and normalize integral JSON numbers.
  ordering: Validate -> PorID -> Conversacion/count -> one provider call -> validate/merge/motor -> inbound LEAD message -> lead CAS Guardar -> VIVI response -> PerfilCompleto event; no transaction exists across these writes.
  validation: Text valid UTF-8, nonblank and <=2000 runes; audio strict-decodes, is nonempty and <=2MB, 1-60s, MIME audio/webm, audio/ogg, or audio/mpeg; invalid input makes no provider call and no write.
  history: Count all persisted AutorMensajeLead records; pass the last six existing chronological messages plus current MensajeUsuario to the one provider call.
  turns: Accepted input is existing lead turns plus one; caps are 4 affiliate and 6 non-affiliate; post-cap is rejected before dispatch and cap plus CONTINUAR completes.
  completion: Complete on PERFIL_COMPLETO, completed critical trio, or cap plus CONTINUAR unless a terminal safety/consent action prevails; transition PERFILANDO to CALIFICADO and publish PerfilCompleto once after durability.
  completion_gate: Conversational gate is ingreso_hogar, recursos_propios, zona_deseada; domain.CamposCriticos remains unchanged.
  audio: Texto is caller-supplied transcription; valid audio has one in-memory ProcesarAudio call, persisted normal audio has audio_original=true, and raw bytes are discarded.
  audio_inintelligible: Persist only SalidaTurno.Respuesta; do not persist inbound history or mutate profile, capacity, intention, or state and do not emit completion.
  transcription_followup: Provider-returned transcription requires a separate contrato-labelled change adding SalidaTurno.transcripcion plus parser, guardrails, Gemini/Qwen adapters, and tests.
  pausar_contacto: PAUSAR_CONTACTO stores only the response; no ad-hoc non-Contract event; consent/route lifecycle belongs to issue 20.
  isolation: No ADK, HTTP, coordinator, recommendation, routing, or ficha work; provider retries and fallback remain provider-owned.
risks:
  - Non-atomic lead CAS plus message inserts can leave partial state; event is only after final response durability.
  - Contract 2.5 transcription is unavailable without a caller transcript; separate DTO change is required.
  - Exact likely scope is 585 authored additions and requires two chained PRs of 317 and 268 lines; no size exception is permitted.
  - Rejecting non-PERFILANDO turns blocks post-qualification chat until issue 20.
  - The one-call constraint means post-merge motor values can only be offered to the next turn, not safely quoted in the current response.
  - Qwen ProcesarAudio returns a typed capability error.
