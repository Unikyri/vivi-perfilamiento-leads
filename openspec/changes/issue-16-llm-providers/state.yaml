remediation:
  required: true
  reason: "Critical Issue 16 remediation: exhausted malformed output was not fallback-eligible; no real per-provider token bucket existed; server health hard-coded CERRADO instead of reporting the retained breaker; prior Slice 1 accounting wording was ambiguous."
  files:
    - "internal/infrastructure/llm/factory.go"
    - "internal/infrastructure/llm/rate_limiter.go"
    - "internal/infrastructure/llm/health.go"
    - "internal/infrastructure/llm/fallback.go"
    - "internal/infrastructure/llm/errors.go"
    - "internal/infrastructure/llm/parser.go"
    - "internal/infrastructure/llm/parser_test.go"
    - "internal/infrastructure/llm/resilience_test.go"
    - "cmd/servidor/main.go"
    - "cmd/servidor/main_test.go"
  malformed_fix: "KindMalformed is fallback-eligible only after the adapter's single same-provider retry; valid JSON Contract violations remain KindInvalidOutput and non-fallbackable."
  limiter_fix: "FallbackProvider gates each provider with a bounded injected-clock TokenBucket; local denial is sanitized and configured fallback remains eligible."
  health_fix: "The server retains the NewFromConfig provider composition and asks the same FallbackProvider breaker for a live health label; nil/unconfigured remains safe."
  numeric_fix: "Response validation restricts only currency-marked amounts to NUMEROS_DEL_MOTOR and ignores arbitrary count/date tokens."
  single_provider_fix: "NewFromConfig always wraps a valid primary in FallbackProvider, even when fallback is absent or invalid, preserving the live primary breaker and limiter for health and runtime calls."
  million_parser_fix: "Currency-marked Colombian expressions including 2 millones, $2 millones, and COP 2 millones normalize to 2,000,000; unauthorized amounts remain invalid and ordinary counts/dates remain accepted."
  contextual_bare_amount_fix: "Bare amounts use lexical adjacency of at most three intervening words, reject intervening numbers and sentence/clause boundaries, accept grouped zero-decimal and ungrouped whole values only when they match the motor, and reject non-integral pesos without float rounding."
  rate_limiter_fix: "Default per-provider token buckets use named internal burst 3 and refill 0.5 tokens/second constants; no new config or environment variable is introduced."
  breaker_fix: "Ineligible failures reset consecutive eligible failures; success continues to reset; exactly three consecutive eligible failures are required to open."
  budget: "Historical estimate only: Slice 7 was previously recorded at 247 net physical implementation lines and cumulative 1,764; current Slice 8 direct edit content is 32 lines. Issue 16 files remain uncommitted/untracked, so exact historical per-slice Git deltas cannot be reconstructed; current-tree counts are recorded under apply_progress."
