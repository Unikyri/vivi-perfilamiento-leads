services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivi
      POSTGRES_USER: vivi
      POSTGRES_PASSWORD: vivi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivi -d vivi"]
      interval: 2s
      timeout: 3s
      retries: 5
